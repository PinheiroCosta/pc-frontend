name: Deploy Frontend to Cloudflare Pages

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact from Build workflow
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          workflow_conclusion: success
          branch: main
          name: frontend-build
          path: ./dist

      - name: Verify artifact
        run: |
          test -f ./dist/index.html

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: romweb-frontend
          directory: ./dist
          branch: main
          wranglerVersion: 2

  cleanup:
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Install Github CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Delete release-please branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Finding release-please branches..."
          branches=$(gh api repos/${{ github.repository }}/branches --jq '.[] | select(.name | startswith("release-please--branches--")) | .name')

          if [ -z "$branches" ]; then
            echo "No release-please branches to delete"
            exit 0
          fi

          for branch in $branches; do
            echo "Deleting branch $branch"
            gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/$branch
          done
